[project]
name = "self-healing-agent"
version = "0.1.0"
description = "GTM Agent self-healing pipeline: LangSmith Deployment + Triage Agent + Open SWE"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.1.0",
    "langgraph>=0.3.0",
    "langgraph-sdk>=0.1.0",
    "langsmith>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "scipy>=1.12.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pygithub>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_agent", "src/triage_agent"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
